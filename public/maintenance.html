<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Maintenance | Greyon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Syne:wght@700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #121110;
        --muted: #7a736a;
        --gold: #9a7b3c;
        --bg: #f6f5f2;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem 1.25rem;
        font-family: Poppins, system-ui, sans-serif;
        color: var(--ink);
        background:
          radial-gradient(ellipse 70% 45% at 50% 0%, rgba(196, 163, 90, 0.22), transparent 55%),
          var(--bg);
      }
      .wrap {
        text-align: center;
        max-width: 28rem;
      }
      .brand {
        margin: 0;
        font-family: Syne, Poppins, sans-serif;
        font-size: clamp(2.4rem, 8vw, 3.4rem);
        font-weight: 700;
        letter-spacing: -0.03em;
        color: var(--gold);
      }
      .eyebrow {
        margin: 1.1rem 0 0;
        font-size: 0.7rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--gold);
        font-weight: 600;
      }
      h1 {
        margin: 0.45rem 0 0;
        font-family: Syne, Poppins, sans-serif;
        font-size: clamp(1.5rem, 4vw, 1.9rem);
        letter-spacing: -0.02em;
      }
      p {
        margin: 0.85rem 0 0;
        color: var(--muted);
        line-height: 1.55;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <p class="brand">Greyon</p>
      <p class="eyebrow">Maintenance</p>
      <h1>We’ll be right back</h1>
      <p>
        Greyon is undergoing scheduled maintenance. Thank you for your patience.
      </p>
    </div>
  </body>
</html>
