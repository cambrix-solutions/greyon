<!doctype html>
<html lang="en">
  <head>
    <title><%= productName %></title>

    <meta charset="utf-8" />
    <meta name="description" content="<%= productDescription %>" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1<% if (ctx.mode.cordova || ctx.mode.capacitor) { %>, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover<% } %>"
    />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; frame-src 'self' https://www.openstreetmap.org https://www.google.com https://maps.google.com;<% if (ctx.dev) { %> connect-src 'self' ws://localhost:* http://localhost:* https://images.unsplash.com; worker-src 'self' blob:;<% } else { %> connect-src 'self' https: https://www.google-analytics.com https://www.googletagmanager.com;<% } %>"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Syne:wght@600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- PNG first so Chrome doesn’t latch onto a bad .ico -->
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/icons/favicon-32x32.png?v=7"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/icons/favicon-16x16.png?v=7"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="48x48"
      href="/icons/favicon-48x48.png?v=7"
    />
    <link rel="shortcut icon" href="/icons/favicon-32x32.png?v=7" />
    <link rel="icon" href="/favicon.ico?v=7" sizes="any" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/icons/apple-icon-180x180.png?v=7"
    />
    <link
      rel="apple-touch-icon"
      sizes="152x152"
      href="/icons/apple-icon-152x152.png?v=7"
    />
    <link
      rel="apple-touch-icon"
      sizes="120x120"
      href="/icons/apple-icon-120x120.png?v=7"
    />
    <meta
      name="msapplication-TileImage"
      content="/icons/ms-icon-144x144.png?v=7"
    />
    <meta name="theme-color" content="#2b0a0a" />
  </head>
  <body>
    <!-- quasar:entry-point -->
  </body>
</html>
