# Coolify Quasar SPA (static)
# Coolify UI:
#   Build strategy     = Nixpacks
#   Site type          = Static
#   Base directory     = /
#   Publish directory  = dist/spa
#   Install command    = npm install
#   Build command      = npm run build
#   Start command      = (empty)
#   Env (build):         NIXPACKS_NODE_VERSION=24
#
# @quasar/app-vite needs Node >= 22.22 — use 24 on Coolify (22.x nixpkgs often lags).

providers = ["node"]

[variables]
NIXPACKS_NODE_VERSION = "24"

[phases.setup]
nixPkgs = ["nodejs_24"]

[phases.install]
cmds = ["npm ci"]

[phases.build]
cmds = ["npm run build"]
