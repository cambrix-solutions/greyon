# Coolify Quasar SPA (static)
# Coolify UI:
#   Build strategy     = Nixpacks
#   Site type          = Static
#   Base directory     = /
#   Publish directory  = dist/spa
#   Install command    = npm ci
#   Build command      = npm run build
#   Start command      = (empty)
#
# Keep Install + Build filled in Coolify — empty overrides can break detection.

providers = ["node"]

[variables]
NIXPACKS_NODE_VERSION = "22"

[phases.setup]
nixPkgs = ["nodejs_22"]

[phases.install]
cmds = ["npm ci"]

[phases.build]
cmds = ["npm run build"]
