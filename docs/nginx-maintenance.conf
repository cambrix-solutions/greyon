# Greyon — nginx maintenance mode (aaPanel)
#
# How to use on the server:
#   ON:  touch /www/wwwroot/greyon/dist/spa/maintenance.on
#   OFF: rm    /www/wwwroot/greyon/dist/spa/maintenance.on
#   nginx -t && nginx -s reload   (only needed if you change this conf)
#
# Requires public/maintenance.html deployed to dist/spa/maintenance.html
#
# Paste the block below into your site conf (inside the server { } block),
# ABOVE the final `location / { try_files ... }` — or put it in:
#   /www/server/panel/vhost/nginx/extension/greyon.ictcenter.blog/maintenance.conf

# --- MAINTENANCE START ---
set $gy_maint 0;
if (-f $document_root/maintenance.on) {
    set $gy_maint 1;
}

# Keep admin + login reachable during maintenance
if ($request_uri ~* ^/admin) {
    set $gy_maint 0;
}

# Allow the maintenance page + its assets / ACME / the flag JSON itself
if ($uri ~* ^/(maintenance\.html|maintenance\.json|maintenance\.on)$) {
    set $gy_maint 0;
}
if ($uri ~* ^/\.well-known/) {
    set $gy_maint 0;
}

if ($gy_maint = 1) {
    return 503;
}

error_page 503 @greyon_maintenance;

location @greyon_maintenance {
    root /www/wwwroot/greyon/dist/spa;
    rewrite ^ /maintenance.html break;
}
# --- MAINTENANCE END ---
