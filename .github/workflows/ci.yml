name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-spa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint · build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci

      - name: Format
        run: npx oxfmt --check

      - name: Lint
        run: npx oxlint

      - name: Build
        env:
          VITE_APP_MODE: production
          VITE_USE_API: "true"
          VITE_ENGINE_URL: https://engine.greyon.site
          VITE_ENGINE_PUBLIC_URL: https://engine.greyon.site
        run: npm run build
