name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-spa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint · build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci

      - name: Format
        run: npx oxfmt --check

      - name: Lint
        run: npx oxlint

      - name: Build
        env:
          VITE_APP_MODE: production
          VITE_USE_API: "true"
          VITE_ENGINE_URL: https://engine.greyon.site
          VITE_ENGINE_PUBLIC_URL: https://engine.greyon.site
        run: npm run build

      # Coolify /api/v1/deploy requires a Bearer API token (401 without it).
      - name: Deploy (Coolify)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          COOLIFY_DEPLOY_WEBHOOK: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          if [ -z "$COOLIFY_DEPLOY_WEBHOOK" ]; then
            echo "COOLIFY_DEPLOY_WEBHOOK secret is missing"
            exit 1
          fi
          if [ -z "$COOLIFY_API_TOKEN" ]; then
            echo "COOLIFY_API_TOKEN secret is missing — create a token in Coolify (Keys & Tokens) and add it as a repo secret"
            exit 1
          fi
          curl --fail --show-error --silent \
            --request GET \
            --header "Authorization: Bearer ${COOLIFY_API_TOKEN}" \
            --header "Accept: application/json" \
            "$COOLIFY_DEPLOY_WEBHOOK"
          echo "Coolify deploy triggered"
